<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AllEars Card Preview</title>
  <!-- Local preview of the Lovelace card with a mock `hass`. Serve the repo
       root (e.g. `python -m http.server`) and open /preview.html. -->
  <style>
    :root {
      --primary-background-color: #f4f6f9; --card-background-color: #fff; --secondary-background-color: #f0f2f5;
      --primary-text-color: #1c1e27; --secondary-text-color: #68707c; --disabled-text-color: #aeb4be;
      --divider-color: rgba(0,0,0,.12); --primary-color: #03a9f4; --rgb-primary-color: 3,169,244;
      --warning-color: #ffa600; --rgb-warning-color: 255,166,0; --text-primary-color: #fff;
    }
    body.dark {
      --primary-background-color: #111; --card-background-color: #1c1c1c; --secondary-background-color: #282828;
      --primary-text-color: #e1e1e1; --secondary-text-color: #9b9b9b; --divider-color: rgba(255,255,255,.12);
    }
    body { margin: 0; padding: 16px; background: var(--primary-background-color); color: var(--primary-text-color);
      font-family: Roboto, system-ui, sans-serif; }
    .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); align-items: start; }
    ha-card { display: block; background: var(--card-background-color); border-radius: 12px; border: 1px solid var(--divider-color); }
    ha-icon { display: inline-block; width: var(--mdc-icon-size, 24px); height: var(--mdc-icon-size, 24px);
      border-radius: 50%; background: currentColor; opacity: .5; }
    h3 { margin: 0 0 6px; font-size: 13px; font-weight: 500; color: var(--secondary-text-color); }
  </style>
</head>
<body>
  <div class="bar">
    <button id="fire">Simulate sound</button>
    <button id="theme">Toggle dark</button>
  </div>
  <div class="grid">
    <div><h3>Connected</h3><all-ears-card id="c1"></all-ears-card></div>
    <div><h3>Waiting for the phone</h3><all-ears-card id="c2"></all-ears-card></div>
    <div><h3>No device</h3><all-ears-card id="c3"></all-ears-card></div>
  </div>
  <script type="module">
    import './custom_components/allears/www/all-ears-card.js';
    const now = Date.now();
    const iso = (ms) => new Date(ms).toISOString();
    const ent = (id, dev, key) => ({ entity_id: id, device_id: dev, platform: 'allears', translation_key: key });
    const base = {
      user: { is_admin: true },
      devices: { d1: { name: 'Bedroom phone' }, d2: { name: 'Kitchen tablet' } },
      entities: {
        'sensor.bedroom_phone_last_sound': ent('sensor.bedroom_phone_last_sound', 'd1', 'last_sound'),
        'binary_sensor.bedroom_phone_sound_active': ent('binary_sensor.bedroom_phone_sound_active', 'd1', 'sound_active'),
        'sensor.bedroom_phone_last_seen': ent('sensor.bedroom_phone_last_seen', 'd1', 'last_seen'),
        'select.bedroom_phone_flow_filter': ent('select.bedroom_phone_flow_filter', 'd1', 'active_flow_filter'),
        'sensor.kitchen_tablet_last_sound': ent('sensor.kitchen_tablet_last_sound', 'd2', 'last_sound'),
        'binary_sensor.kitchen_tablet_sound_active': ent('binary_sensor.kitchen_tablet_sound_active', 'd2', 'sound_active'),
        'select.kitchen_tablet_flow_filter': ent('select.kitchen_tablet_flow_filter', 'd2', 'active_flow_filter'),
      },
      states: {
        'sensor.bedroom_phone_last_sound': { state: 'Baby cry, infant cry', last_updated: iso(now - 120000),
          attributes: { flow_name: 'Nursery', confidence: 0.91, timestamp: iso(now - 120000) } },
        'binary_sensor.bedroom_phone_sound_active': { state: 'off', attributes: {} },
        'sensor.bedroom_phone_last_seen': { state: iso(now - 60000), attributes: {} },
        'select.bedroom_phone_flow_filter': { state: 'All Flows', attributes: { options: ['All Flows', 'Nursery', 'Security', 'Doorbell'] } },
        'sensor.kitchen_tablet_last_sound': { state: 'unknown', attributes: {} },
        'binary_sensor.kitchen_tablet_sound_active': { state: 'off', attributes: {} },
        'select.kitchen_tablet_flow_filter': { state: 'All Flows', attributes: { options: ['All Flows'] } },
      },
      callService: (d, s, data) => console.log('callService', d, s, data),
      callWS: async (msg) => ({ [msg.entity_ids[0]]: msg.entity_ids[0].startsWith('sensor.bedroom') ? [
        { s: 'Glass', a: { flow_name: 'Security', confidence: 0.74, timestamp: iso(now - 3600e3 * 5) }, lu: (now - 3600e3 * 5) / 1000 },
        { s: 'Doorbell', a: { flow_name: 'Doorbell', confidence: 0.88, timestamp: iso(now - 3600e3 * 2) }, lu: (now - 3600e3 * 2) / 1000 },
        { s: 'Baby cry, infant cry', a: { flow_name: 'Nursery', confidence: 0.91, timestamp: iso(now - 120000) }, lu: (now - 120000) / 1000 },
      ] : [] }),
    };
    let hass = base;
    const c1 = document.getElementById('c1'); c1.setConfig({ device_id: 'd1' }); c1.hass = hass;
    const c2 = document.getElementById('c2'); c2.setConfig({ device_id: 'd2' }); c2.hass = hass;
    const c3 = document.getElementById('c3'); c3.setConfig({}); c3.hass = { ...base, entities: {}, states: {} };
    document.getElementById('fire').onclick = () => {
      const t = Date.now();
      hass = { ...hass, states: { ...hass.states,
        'sensor.bedroom_phone_last_sound': { state: 'Dog', last_updated: iso(t), attributes: { flow_name: 'Security', confidence: 0.83, timestamp: iso(t) } },
        'binary_sensor.bedroom_phone_sound_active': { state: 'on', attributes: {} },
        'sensor.bedroom_phone_last_seen': { state: iso(t), attributes: {} } } };
      c1.hass = hass;
    };
    document.getElementById('theme').onclick = () => document.body.classList.toggle('dark');
  </script>
</body>
</html>
