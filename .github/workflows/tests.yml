name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: "Python ${{ matrix.python-version }} / HA ${{ matrix.ha-version }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            ha-version: "2024.1.0"
            phcc-version: "==0.13.109"
          - python-version: "3.12"
            ha-version: "2024.6.0"
            phcc-version: "==0.13.205"
          # Current Home Assistant: catches removed core APIs early.
          - python-version: "3.13"
            ha-version: "latest"
            phcc-version: ""
            # aiodns 4.0 (pinned by HA) needs the pycares 5 API; newer pycares breaks it.
            extra-deps: "pycares>=5,<6"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Older pytest-homeassistant-custom-component sets the "US/Pacific" time
      # zone; newer Ubuntu runners ship those legacy names in tzdata-legacy.
      - name: Install legacy time zone names
        run: sudo apt-get install -y -q tzdata-legacy || true

      - name: Install dependencies
        run: |
          pip install \
            "josepy<1.15" \
            pytest \
            pytest-asyncio \
            "pytest-homeassistant-custom-component${{ matrix.phcc-version }}" \
            pytest-cov \
            freezegun \
            ${{ matrix.extra-deps && format('"{0}"', matrix.extra-deps) || '' }}

      - name: Run tests
        run: |
          pytest tests/ \
            --cov=custom_components/allears \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=90 \
            -v

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-py${{ matrix.python-version }}-ha${{ matrix.ha-version }}
          path: coverage.xml
          if-no-files-found: ignore
          retention-days: 14
